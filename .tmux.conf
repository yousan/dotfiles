#################################################
#
#  BASIC Setting
#

#  256 色端末を使用する
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
# set -g default-terminal 'screen-256color'
# set -g terminal-overrides 'xterm:colors=256'

#
#  Prefix キーを Ctrl-b から Ctrl-j に変更
#
set -g prefix C-t
unbind C-b


# ベル設定
# none    : 全て無視（デフォルト）
# any     : 全ウィンドウのベルをクライアント（iTerm2等）に転送
# current : アクティブウィンドウのみ転送
# other   : バックグラウンドウィンドウのみ転送
#
# tmux+SSH+iTerm2 環境で Claude Code の stop hook（echo -e '\a'）を
# 通知音として受け取るには "any" に設定する。
# iTerm2 側は Preferences > Profiles > Terminal > Notifications で
# "Audible bell" を有効にすること。
set-option -g bell-action any
# ウィンドウ番号基準値
set-option -g base-index 1
# ウィンドウの自動リネームoff
set-window-option -g automatic-rename off
# ウィンドウで動作があるとステータスラインでハイライト
set-window-option -g monitor-activity on

# コピー、選択モードのキーバインドemacs
set -g mode-keys emacs

# 設定ファイル再読み込み r
bind r source-file ~/.tmux.conf \; display-message "Reloaded config !!"

# ペイン終了
bind k kill-pane

# ペインの縦分割
bind 2 split-window -v
# ペインの横分割
bind 4 split-window -h

# スクロールバックに関する設定（スクロールバックは C-t [）
## 履歴の行数を増やす
set -g history-limit 100000
## マウスでスクロールバックできる
set -g mouse on
#################################################
# Plugins (TPM)
#################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: capture pane contents and restore vim/nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# continuum: autosave every 15 min, auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (keep at the very bottom of this file)
run '~/.tmux/plugins/tpm/tpm'
